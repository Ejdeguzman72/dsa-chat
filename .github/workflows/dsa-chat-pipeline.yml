
stages:
  - build
  - test
  - package

build:
  stage: build
  image: maven:3-eclipse-temurin-17
  script:
    - mvn compile

test:
  stage: test
  image: maven:3-eclipse-temurin-17
  script:
    - mvn test

package:
  stage: package
  image: maven:3-eclipse-temurin-17
  script:
    - mvn package -DskipTests
  artifacts:
    paths:
      - target/*.jar
